license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Lucky blocks with good and bad outcomes, some hidden in the world as near-perfect copies of the blocks around them, and a village casino where the tokens they drop can be won, lost and traded.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"
